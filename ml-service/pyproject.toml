[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "grit-question-classifier"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "numpy>=2,<3", "scikit-learn>=1.6,<2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "mlflow-skinny>=3.5,<4", "pillow>=11,<13", "pandas>=2.2,<4", "sqlalchemy>=2,<3", "alembic>=1.14,<2"]

[project.optional-dependencies]
candidates = ["torch>=2.6,<3", "transformers>=4.51,<5", "xgboost>=3,<4", "safetensors>=0.5,<1"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
experiments = [
    "optuna>=4,<5",
]

[project.scripts]
grit-ml = "grit_ml.cli:main"

[tool.setuptools.package-data]
grit_ml = ["taxonomy.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
