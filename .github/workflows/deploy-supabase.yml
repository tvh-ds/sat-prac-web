# Deploys Supabase schema + Edge Functions to production.
#
# Triggers on pushes to master that touch backend/supabase/**, or manually.
# Migrations run BEFORE function deploys (the worker and new functions depend
# on the latest columns). Cloudflare Pages deploys the frontend from the same
# push via its own integration.
#
# Required repository secrets:
#   SUPABASE_ACCESS_TOKEN - personal access token (https://supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD  - database password (Database -> Settings in dashboard)

name: Deploy Supabase

on:
  push:
    branches: [master]
    paths: ["backend/supabase/**"]
  workflow_dispatch:

concurrency:
  group: supabase-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions
        run: deno check supabase/functions/admin-pdf-imports/index.ts supabase/functions/admin-practice/index.ts supabase/functions/admin-practice-assignments/index.ts supabase/functions/admin-progress/index.ts supabase/functions/admin-questions/index.ts supabase/functions/admin-students/index.ts supabase/functions/admin-tests/index.ts supabase/functions/admin-vocab/index.ts supabase/functions/student-attempts/index.ts supabase/functions/student-responses/index.ts supabase/functions/student-scores/index.ts supabase/functions/student-submit/index.ts supabase/functions/student-tests/index.ts supabase/functions/student-vocab/index.ts supabase/functions/_shared/modules.ts supabase/functions/_shared/drafts.ts supabase/functions/_shared/validation.ts supabase/functions/_shared/scoring_test.ts

      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Link production project
        run: supabase link --project-ref ygqndcgpbtmewzkruyuq

      - name: Apply database migrations
        run: supabase db push

      - name: Deploy Edge Functions
        run: supabase functions deploy

      - name: Verify deployment
        run: |
          supabase migration list
          supabase functions list
