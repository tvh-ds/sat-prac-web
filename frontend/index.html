<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAT Practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      (function () {
        try {
          // Gold-only lock: accent is always champagne gold.
          document.documentElement.dataset.accent = "gold";
          try { localStorage.setItem("sat-accent", "gold"); } catch (e) {}
          // Silver try-both preview: append ?theme=silver to any URL.
          var q = new URLSearchParams(window.location.search);
          if (q.get("theme") === "silver") {
            document.documentElement.dataset.themeVariant = "silver";
          }
        } catch (e) {
          document.documentElement.dataset.accent = "gold";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
